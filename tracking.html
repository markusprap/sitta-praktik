<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Pengiriman - SITTA Universitas Terbuka</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div id="tracking-page" class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <img src="assets/logo/logo-ut-putih.png" alt="SITTA Logo" class="logo-icon">
                    <h2 class="logo-text">SITTA</h2>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle" title="Minimize Sidebar">
                    <i data-lucide="chevrons-left"></i>
                </button>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="dashboard.html"><i data-lucide="home"></i> <span>Dashboard</span></a></li>
                    <li><a href="stok.html"><i data-lucide="book-open"></i> <span>Informasi Bahan Ajar</span></a></li>
                    <li><a href="tracking.html" class="active"><i data-lucide="truck"></i> <span>Tracking Pengiriman</span></a></li>
                    <li class="has-submenu">
                        <a href="#" class="submenu-toggle"><i data-lucide="file-text"></i> <span>Laporan</span> <i data-lucide="chevron-down" class="chevron"></i></a>
                        <ul class="submenu">
                            <li><a href="monitoring.html"><i data-lucide="activity"></i> <span>Monitoring Progress DO</span></a></li>
                            <li><a href="rekap.html"><i data-lucide="bar-chart-3"></i> <span>Rekap Bahan Ajar</span></a></li>
                        </ul>
                    </li>
                    <li><a href="histori.html"><i data-lucide="clock"></i> <span>Histori Transaksi</span></a></li>
                    <li><a href="index.html" id="logoutButton"><i data-lucide="log-out"></i> <span>Logout</span></a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <h1>Lacak Pengiriman Bahan Ajar</h1>
                <div class="header-actions">
                    <button class="menu-toggle" id="menu-toggle">☰</button>
                </div>
            </header>

            <section class="content">
                <div class="card">
                    <h2>Masukkan Nomor Delivery Order</h2>
                    <form id="trackingForm" class="tracking-form">
                        <input type="text" id="nomorResi" placeholder="Contoh: 2023001234" required>
                        <button type="submit" id="cariButton" class="btn btn-small">Cari</button>
                    </form>
                </div>

                <div id="trackingResult" class="card" style="display: none;">
                    <!-- Tracking results will be dynamically inserted here -->
                </div>
            </section>
        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
